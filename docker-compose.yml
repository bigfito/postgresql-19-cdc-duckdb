# =============================================================================
# ElastiFlix CDC Lakehouse Lab
# =============================================================================
# Levanta el laboratorio completo con un único comando:
#
#   docker compose up -d --build
#
# Las credenciales y los puertos del host se leen de .env, copia local de
# .env.example (diseño, sección 45.5).
#
# Reglas de este archivo (diseño, secciones 39 y 40):
#   - El nombre del proyecto es fijo, para que dos clones o un directorio
#     renombrado no creen proyectos distintos sobre los mismos datos.
#   - Ningún servicio declara container_name: los nombres los genera Compose
#     (elastiflix-cdc-lakehouse-<servicio>-1).
#   - Los servicios se hablan por la red por defecto del proyecto y por nombre
#     de servicio; no hay redes externas ni network_mode: host.
#   - Cada puerto publicado va como 127.0.0.1:${VARIABLE:-valor}:puerto.
#   - Ningún servicio declara restart.
#   - Cada servicio guarda sus datos en su propio directorio (sección 7).
#
# Los servicios se añaden fase a fase según planning/PLAN.md.

name: elastiflix-cdc-lakehouse

# -----------------------------------------------------------------------------
# Puertos publicados en el host (diseño, sección 39)
# -----------------------------------------------------------------------------
# Todos escuchan solo en 127.0.0.1. El puerto del host sale de .env; si una
# variable falta, se usa el valor por defecto. Las conexiones entre servicios
# usan el puerto del contenedor y no dependen de estos valores.
#
# Cada servicio los toma con su ancla, por ejemplo:
#
#   postgresql:
#     ports: *ports-postgresql
#
# metadata-db no publica ningún puerto: solo lo usan Airflow y Superset dentro
# de la red del proyecto.
x-host-ports:
  # PostgreSQL operacional.
  postgresql: &ports-postgresql
    - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
  # Interfaz web y API REST de Flink, en el JobManager.
  flink-jobmanager: &ports-flink-jobmanager
    - "127.0.0.1:${FLINK_UI_HOST_PORT:-8081}:8081"
  # Interfaz web del master de Spark. Escucha en el 8080 dentro del
  # contenedor, igual que Airflow; por eso se publica en el 8082 del host.
  spark-master: &ports-spark-master
    - "127.0.0.1:${SPARK_UI_HOST_PORT:-8082}:8080"
  # Interfaz web y API de Airflow.
  airflow-apiserver: &ports-airflow-apiserver
    - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
  # Superset.
  superset: &ports-superset
    - "127.0.0.1:${SUPERSET_HOST_PORT:-8088}:8088"
  # RustFS: API S3 y consola web.
  rustfs: &ports-rustfs
    - "127.0.0.1:${RUSTFS_API_HOST_PORT:-9000}:9000"
    - "127.0.0.1:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
  # Iceberg REST Catalog.
  iceberg-rest: &ports-iceberg-rest
    - "127.0.0.1:${ICEBERG_REST_HOST_PORT:-8181}:8181"

# -----------------------------------------------------------------------------
# Imagen y variables comunes a los tres servicios de Flink (diseño, sección 14)
# -----------------------------------------------------------------------------
# flink-jobmanager, flink-taskmanager y flink-cdc-submit comparten la imagen
# que construye flink/Dockerfile.
x-flink-build: &flink-build
  context: ./flink

x-flink-environment: &flink-environment
  # Nombre con el que el TaskManager y el cliente de envío encuentran al
  # JobManager. Sin él, cada contenedor usaría su propio nombre.
  JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
  # S3FileIO toma de aquí la clave de RustFS; no está en el YAML del pipeline.
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
  AWS_REGION: ${AWS_REGION:-us-east-1}

# -----------------------------------------------------------------------------
# Imagen, variables y montajes comunes a los servicios de Spark (diseño,
# secciones 18 y 19)
# -----------------------------------------------------------------------------
# spark-master y spark-worker comparten la imagen que construye
# pyspark/Dockerfile.
x-spark-build: &spark-build
  context: ./pyspark

x-spark-environment: &spark-environment
  # S3FileIO toma de aquí la clave de RustFS; no está en pyspark/conf. La
  # reciben el master, el worker (y con él sus ejecutores) y el contenedor
  # temporal que hace de driver cuando un job se lanza a mano.
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
  AWS_REGION: ${AWS_REGION:-us-east-1}

# Solo lectura: la configuración de Spark, los jobs y los datos de referencia
# de Silver. Nadie los copia en la imagen, así hay una sola copia de cada uno.
x-spark-volumes: &spark-volumes
  - ./pyspark/conf:/opt/spark/conf:ro
  - ./pyspark/jobs:/opt/spark/jobs:ro
  - ./pyspark/reference:/opt/spark/reference:ro

# -----------------------------------------------------------------------------
# Imagen, variables y montajes comunes a los servicios de Airflow (diseño,
# secciones 18 y 45)
# -----------------------------------------------------------------------------
# airflow-init, airflow-apiserver, airflow-scheduler y airflow-dag-processor
# comparten la imagen que construye airflow/Dockerfile.
x-airflow-build: &airflow-build
  context: ./airflow

x-airflow-environment: &airflow-environment
  # Metadatos en metadata-db, en la base airflow y con la cuenta airflow.
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}@metadata-db:5432/airflow
  # Las tareas corren como procesos del propio scheduler.
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # Gestor de autenticación de Flask AppBuilder: las cuentas viven en
  # metadata-db, con la contraseña cifrada (sección 45.4).
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Secretos internos que comparten los servicios de Airflow: la clave que
  # cifra las conexiones guardadas, la que firma los tokens entre servicios y
  # la que firma el acceso a los logs.
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?falta AIRFLOW_FERNET_KEY en .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?falta AIRFLOW_JWT_SECRET en .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?falta AIRFLOW_API_SECRET_KEY en .env}
  # Por aquí reporta cada tarea su estado al servidor de la API.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  # Clúster de Spark al que SparkSubmitOperator envía los jobs. En modo
  # cliente el driver corre en el contenedor de Airflow.
  AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077?deploy-mode=client
  # El driver de Spark lee y escribe en RustFS; S3FileIO toma de aquí la clave.
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
  AWS_REGION: ${AWS_REGION:-us-east-1}

# Los DAG, la configuración y los plugins, en solo lectura; los logs, que es
# lo único que Airflow escribe en el host; y, también en solo lectura, la
# configuración de Spark, los jobs y los datos de referencia, en las mismas
# rutas que en los contenedores de Spark: en modo cliente spark-submit lee el
# job en la máquina que lo lanza.
x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags:ro
  - ./airflow/config:/opt/airflow/config:ro
  - ./airflow/plugins:/opt/airflow/plugins:ro
  - ./airflow/logs:/opt/airflow/logs
  - ./pyspark/conf:/opt/spark/conf:ro
  - ./pyspark/jobs:/opt/spark/jobs:ro
  - ./pyspark/reference:/opt/spark/reference:ro

# -----------------------------------------------------------------------------
# Imagen, variables y montajes comunes a superset y superset-init (diseño,
# secciones 34, 35 y 45)
# -----------------------------------------------------------------------------
x-superset-build: &superset-build
  context: ./superset

x-superset-environment: &superset-environment
  # Metadatos en metadata-db, en la base superset y con la cuenta superset.
  # La lee superset/config/superset_config.py.
  SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD:?falta SUPERSET_DB_PASSWORD en .env}@metadata-db:5432/superset
  # Clave que firma las sesiones y cifra las credenciales que Superset guarda.
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?falta SUPERSET_SECRET_KEY en .env}
  # La clave de RustFS, para el DuckDB que corre dentro de Superset. El hook
  # de conexión la pone en los marcadores de duckdb/init/attach_lakehouse.sql.
  AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
  AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}

# La configuración y el SQL de DuckDB, en solo lectura, y el directorio de
# trabajo de Superset, que es lo único que escribe en el host.
x-superset-volumes: &superset-volumes
  - ./superset/config:/app/pythonpath:ro
  - ./duckdb/init:/duckdb/init:ro
  - ./superset/data:/app/superset_home

# -----------------------------------------------------------------------------
# Volúmenes (diseño, secciones 7 y 15)
# -----------------------------------------------------------------------------
# rustfs-data es el único volumen con nombre del laboratorio. Los datos de
# RustFS no van en rustfs/data, como pediría la regla de un directorio por
# servicio, porque sobre un directorio compartido desde Windows RustFS deja de
# responder bajo carga y devuelve 503, lo que detiene el pipeline de Flink.
# En el volumen los datos viven en el disco de Docker: no se ven desde
# Windows y se borran con `docker volume rm`, no vaciando un directorio.
# Se evaluó sustituir RustFS por SeaweedFS, que permitiría volver a un
# directorio; se decidió seguir con RustFS sobre el volumen (decisión 67).
volumes:
  rustfs-data:

services:

  # ---------------------------------------------------------------------------
  # volumes-init (job one-shot; diseño, sección 45.2)
  # ---------------------------------------------------------------------------
  # Asigna a cada directorio de datos el UID:GID del servicio que escribe en él,
  # antes de que arranquen los servicios con estado. Es el único servicio que
  # corre como root. Reutiliza la imagen de RustFS, que trae sh y chown.
  # PostgreSQL y metadata-db no aparecen: su imagen prepara sola su directorio.
  # Spark y el simulador no escriben en ningún directorio del host.
  volumes-init:
    image: rustfs/rustfs:1.0.6
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        prepare() {
          chown "$$2" "/mnt/$$1"
          echo "$$1: $$(stat -c '%u:%g' "/mnt/$$1")"
        }
        prepare flink-data     9999:9999
        prepare airflow-logs   50000:0
        prepare superset-data  1000:1000
        prepare rustfs-data    10001:10001
        prepare iceberg-data   1000:1000
    volumes:
      - ./flink/data:/mnt/flink-data
      - ./airflow/logs:/mnt/airflow-logs
      - ./superset/data:/mnt/superset-data
      - rustfs-data:/mnt/rustfs-data
      - ./iceberg/data:/mnt/iceberg-data
    mem_limit: 64m

  # ---------------------------------------------------------------------------
  # metadata-db (diseño, secciones 39 y 45.3)
  # ---------------------------------------------------------------------------
  # PostgreSQL de metadatos de Airflow y Superset, separado de la base
  # operacional. metadata-db/init/ crea las cuentas airflow y superset y una
  # base para cada una la primera vez que arranca. No publica ningún puerto.
  # La imagen arranca como root, prepara su directorio de datos y baja al
  # usuario postgres (999:999); no necesita volumes-init.
  metadata-db:
    image: postgres:19.0
    environment:
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?falta METADATA_DB_PASSWORD en .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?falta SUPERSET_DB_PASSWORD en .env}
    volumes:
      # Desde PostgreSQL 18 el volumen es /var/lib/postgresql (sección 7).
      - ./metadata-db/data:/var/lib/postgresql
      - ./metadata-db/init:/docker-entrypoint-initdb.d:ro
    # Por TCP y no por el socket: durante la inicialización la imagen levanta
    # un servidor temporal que solo escucha en el socket. Así el servicio solo
    # está sano cuando las dos bases ya existen.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # postgresql (diseño, secciones 10, 12 y 39)
  # ---------------------------------------------------------------------------
  # Base operacional: elastiflix, esquema catalog. Es el origen del CDC.
  # postgresql/init/ crea, la primera vez que arranca, las 20 tablas, las
  # cuentas elastiflix_app y elastiflix_cdc y la publicación elastiflix_pub.
  # Las tablas arrancan vacías: las llena el simulador.
  # La imagen arranca como root, prepara su directorio de datos y baja al
  # usuario postgres (999:999); no necesita volumes-init.
  postgresql:
    image: postgres:19.0
    # Replicación lógica para Flink CDC (sección 10):
    #   wal_level=logical           el WAL lleva lo que pgoutput necesita.
    #   max_replication_slots       el slot elastiflix_cdc y los auxiliares del
    #   y max_wal_senders           snapshot inicial; 10 es el valor por defecto.
    #   max_slot_wal_keep_size=2GB  tope del WAL que retiene el slot si Flink
    #                               está parado; sin él se llena el disco.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - max_slot_wal_keep_size=2GB
    environment:
      POSTGRES_DB: elastiflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      ELASTIFLIX_APP_PASSWORD: ${ELASTIFLIX_APP_PASSWORD:?falta ELASTIFLIX_APP_PASSWORD en .env}
      ELASTIFLIX_CDC_PASSWORD: ${ELASTIFLIX_CDC_PASSWORD:?falta ELASTIFLIX_CDC_PASSWORD en .env}
    ports: *ports-postgresql
    volumes:
      # Desde PostgreSQL 18 el volumen es /var/lib/postgresql (sección 7).
      - ./postgresql/data:/var/lib/postgresql
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    # Por TCP y no por el socket: durante la inicialización la imagen levanta
    # un servidor temporal que solo escucha en el socket. Así el servicio solo
    # está sano cuando postgresql/init/ ha terminado; si un archivo de
    # inicialización falla, el contenedor se detiene y nunca llega a estarlo.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "elastiflix"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # rustfs (diseño, secciones 15 y 39)
  # ---------------------------------------------------------------------------
  # Almacenamiento de objetos compatible con S3: guarda los archivos Iceberg de
  # las tres capas en el bucket warehouse. API S3 en el 9000 y consola web en
  # el 9001. Todos los clientes usan el endpoint interno http://rustfs:9000 con
  # acceso path-style.
  # Corre como el usuario rustfs (10001:10001) de la imagen; por eso espera a
  # volumes-init, que le deja su volumen de datos con ese dueño.
  # Sus datos son la excepción a la regla de un directorio por servicio: van
  # en el volumen rustfs-data y no en rustfs/data (ver «Volúmenes», arriba).
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      # Una sola clave para todos los clientes y para la consola (sección 45.3).
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
      # Logs por la salida estándar, para verlos con docker compose logs.
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
    ports: *ports-rustfs
    volumes:
      - rustfs-data:/data
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    # /health/ready no pide credenciales y solo responde bien cuando el
    # almacenamiento ya acepta peticiones.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # rustfs-init (job one-shot; diseño, sección 15)
  # ---------------------------------------------------------------------------
  # Crea el bucket warehouse si no existe, con una petición S3 firmada. Reutiliza
  # la imagen de RustFS, que trae curl con --aws-sigv4; no hace falta una imagen
  # de cliente S3. Es idempotente: si el bucket ya existe, no hace nada.
  rustfs-init:
    image: rustfs/rustfs:1.0.6
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        endpoint=http://rustfs:9000
        bucket=warehouse
        s3() {
          curl --silent --show-error --fail --output /dev/null \
               --aws-sigv4 "aws:amz:$${AWS_REGION}:s3" \
               --user "$${RUSTFS_ACCESS_KEY}:$${RUSTFS_SECRET_KEY}" "$$@"
        }
        if s3 --head "$$endpoint/$$bucket" 2>/dev/null; then
          echo "El bucket $$bucket ya existe."
        else
          s3 --request PUT "$$endpoint/$$bucket"
          echo "Bucket $$bucket creado."
        fi
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      rustfs:
        condition: service_healthy
    mem_limit: 64m

  # ---------------------------------------------------------------------------
  # iceberg-rest (diseño, sección 16)
  # ---------------------------------------------------------------------------
  # Catálogo REST de Iceberg, compartido por Flink, Spark y DuckDB: registra
  # las tablas de las tres capas, cuyos archivos viven en RustFS. Es la imagen
  # de referencia del proyecto Iceberg, pensada para pruebas. No pide
  # credenciales; solo es alcanzable dentro de la red y en 127.0.0.1.
  # Corre como el usuario iceberg (1000:1000) de la imagen. Arranca tras
  # rustfs-init: sin bucket no hay donde crear tablas.
  # El healthcheck es el que ya declara la imagen (curl a /v1/config).
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      # Dónde se guardan las tablas y cómo se llega a RustFS.
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # El catálogo es un archivo SQLite. Por defecto la imagen lo deja en /tmp,
      # que se pierde al recrear el contenedor; aquí va a iceberg/data/.
      CATALOG_URI: jdbc:sqlite:/catalog/iceberg_catalog.db
      # Una sola conexión a SQLite. Con las dos que abre por defecto, cuando el
      # catálogo arranca sobre un archivo que ya existe una de ellas se queda
      # con un bloqueo de lectura, y los commits que le tocan a la otra fallan
      # con «database is locked»: cada fallo reinicia el pipeline de Flink.
      CATALOG_CLIENTS: "1"
      # La clave única de RustFS (sección 45.3).
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports: *ports-iceberg-rest
    volumes:
      - ./iceberg/data:/catalog
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # iceberg-init (job one-shot; diseño, sección 16)
  # ---------------------------------------------------------------------------
  # Crea en el catálogo los namespaces bronze, silver y gold, uno por capa.
  # Reutiliza la imagen de RustFS, que trae curl, igual que rustfs-init. Es
  # idempotente: si un namespace ya existe, el catálogo responde 409 y cuenta
  # como éxito. El catálogo no pide credenciales.
  iceberg-init:
    image: rustfs/rustfs:1.0.6
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        catalog=http://iceberg-rest:8181/v1
        for ns in bronze silver gold; do
          code=$$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                       --request POST --header 'Content-Type: application/json' \
                       --data "{\"namespace\": [\"$$ns\"]}" "$$catalog/namespaces")
          case "$$code" in
            200) echo "Namespace $$ns creado." ;;
            409) echo "El namespace $$ns ya existe." ;;
            *)   echo "No se pudo crear el namespace $$ns: HTTP $$code" >&2; exit 1 ;;
          esac
        done
    depends_on:
      iceberg-rest:
        condition: service_healthy
    mem_limit: 64m

  # ---------------------------------------------------------------------------
  # flink-jobmanager (diseño, secciones 14 y 39)
  # ---------------------------------------------------------------------------
  # Coordina el clúster de Flink y sirve su interfaz web y su API REST en el
  # 8081. Es un clúster standalone sin alta disponibilidad: si este servicio se
  # reinicia, arranca sin jobs y flink-cdc-submit reanuda el pipeline desde su
  # último checkpoint en el siguiente `docker compose up`.
  # Corre como el usuario flink (9999:9999); por eso espera a volumes-init, que
  # le deja flink/data con ese dueño.
  flink-jobmanager:
    image: elastiflix-flink:2.2.1-cdc3.7.0
    build: *flink-build
    command: jobmanager
    environment: *flink-environment
    ports: *ports-flink-jobmanager
    volumes:
      # Checkpoints: la misma ruta en el JobManager y en el TaskManager.
      - ./flink/data:/opt/flink/state
    depends_on:
      volumes-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # flink-taskmanager (diseño, secciones 14 y 39)
  # ---------------------------------------------------------------------------
  # Ejecuta el pipeline: lee el WAL de PostgreSQL y escribe Bronze en Iceberg.
  # Si cae, el job se recupera solo desde su último checkpoint.
  flink-taskmanager:
    image: elastiflix-flink:2.2.1-cdc3.7.0
    build: *flink-build
    command: taskmanager
    environment: *flink-environment
    volumes:
      - ./flink/data:/opt/flink/state
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    # Está sano cuando el JobManager lo ve registrado.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://flink-jobmanager:8081/taskmanagers | jq --exit-status '.taskmanagers | length > 0' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g

  # ---------------------------------------------------------------------------
  # flink-cdc-submit (job one-shot; diseño, sección 14)
  # ---------------------------------------------------------------------------
  # Envía el pipeline PostgreSQL -> Bronze, o lo reanuda desde su último
  # checkpoint, y termina cuando el job está en RUNNING. Es idempotente: si el
  # pipeline ya corre, no hace nada. La lógica está en
  # flink/jobs/submit-pipeline.sh.
  # Espera a todo lo que el pipeline necesita: el clúster de Flink, PostgreSQL
  # con su publicación y el catálogo con sus namespaces.
  flink-cdc-submit:
    image: elastiflix-flink:2.2.1-cdc3.7.0
    build: *flink-build
    command: ["bash", "/opt/flink/jobs/submit-pipeline.sh"]
    environment:
      <<: *flink-environment
      ELASTIFLIX_CDC_PASSWORD: ${ELASTIFLIX_CDC_PASSWORD:?falta ELASTIFLIX_CDC_PASSWORD en .env}
    volumes:
      # Solo lectura: de aquí solo busca el checkpoint más reciente.
      - ./flink/data:/opt/flink/state:ro
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      iceberg-init:
        condition: service_completed_successfully
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # java-simulator (diseño, secciones 9, 39 y 40)
  # ---------------------------------------------------------------------------
  # Event Simulator: hace de aplicación transaccional. Lee el dataset de
  # raw_data/ y ejecuta INSERT, UPDATE y DELETE reales sobre PostgreSQL, que
  # Flink CDC lleva a Bronze. Con DuckDB embebido comprueba, en solo lectura,
  # que cada cambio llegó.
  # Arranca solo, en modo de líneas, cuando el pipeline ya está en RUNNING, y
  # escribe una línea por transacción (docker compose logs java-simulator). Su
  # interfaz de consola se abre con:
  #
  #   docker compose attach java-simulator      y después cualquier tecla
  #
  # Q cierra la interfaz sin detener nada; Ctrl-P, Ctrl-Q desconecta. Se detiene
  # con `docker compose stop java-simulator` y, al volver a arrancar, continúa
  # con la primera película pendiente.
  # Corre como el usuario simulator (10002:10002), que crea su Dockerfile. No
  # publica puertos ni escribe en ningún directorio del host; por eso no
  # necesita volumes-init. No lleva healthcheck: no es un servicio con estado
  # y nadie espera a que esté sano.
  java-simulator:
    image: elastiflix-simulator:1.0.0
    build:
      context: ./java-simulator
    # Terminal y entrada abiertas aunque nadie esté conectado: sin ellas la
    # interfaz no se puede abrir con docker compose attach.
    tty: true
    stdin_open: true
    environment:
      # Cuenta elastiflix_app de PostgreSQL (sección 45.3).
      ELASTIFLIX_APP_PASSWORD: ${ELASTIFLIX_APP_PASSWORD:?falta ELASTIFLIX_APP_PASSWORD en .env}
      # La clave única de RustFS, para que DuckDB lea Bronze. Sustituye a los
      # marcadores de duckdb/init/attach_lakehouse.sql justo antes de ejecutarlo.
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Configuración de la simulación (sección 9.6). Los valores por defecto
      # son los del diseño; las cuatro primeras se cambian después desde la
      # interfaz.
      SIMULATOR_DELAY_MS: ${SIMULATOR_DELAY_MS:-250}
      SIMULATOR_INSERT_WEIGHT: ${SIMULATOR_INSERT_WEIGHT:-70}
      SIMULATOR_UPDATE_WEIGHT: ${SIMULATOR_UPDATE_WEIGHT:-25}
      SIMULATOR_DELETE_WEIGHT: ${SIMULATOR_DELETE_WEIGHT:-5}
      SIMULATOR_RANDOM_SEED: ${SIMULATOR_RANDOM_SEED:-42}
      SIMULATOR_CONTINUOUS: ${SIMULATOR_CONTINUOUS:-true}
      SIMULATOR_AUTOSTART: ${SIMULATOR_AUTOSTART:-true}
      # Seguimiento de cada cambio hasta Bronze y límites de DuckDB.
      SIMULATOR_TRACK_BRONZE: ${SIMULATOR_TRACK_BRONZE:-true}
      SIMULATOR_TRACK_INTERVAL_MS: ${SIMULATOR_TRACK_INTERVAL_MS:-5000}
      SIMULATOR_TRACK_LATE_MS: ${SIMULATOR_TRACK_LATE_MS:-120000}
      SIMULATOR_DUCKDB_THREADS: ${SIMULATOR_DUCKDB_THREADS:-2}
      SIMULATOR_DUCKDB_MEMORY_LIMIT: ${SIMULATOR_DUCKDB_MEMORY_LIMIT:-128MB}
    volumes:
      # Solo lectura: el dataset y el SQL de inicialización de DuckDB. Nadie
      # los copia en la imagen, así hay una sola copia de cada uno.
      - ./raw_data:/raw_data:ro
      - ./duckdb/init:/duckdb/init:ro
    depends_on:
      # El simulador no emite hasta que el pipeline está en RUNNING: es cuando
      # flink-cdc-submit termina bien (sección 40).
      flink-cdc-submit:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
    # Con la interfaz abierta el log recibe también las secuencias de dibujo,
    # cerca de 1 KB por segundo. Se limita su tamaño; las líneas de cada
    # transacción quedan además en /tmp/simulator.log dentro del contenedor.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # spark-master (diseño, secciones 19, 39 y 40)
  # ---------------------------------------------------------------------------
  # Coordina el clúster standalone de Spark, el que ejecuta los jobs por lotes:
  # Bronze -> Silver, Silver -> Gold, las validaciones y el mantenimiento. Los
  # jobs se le envían a spark://spark-master:7077; su interfaz web escucha en el
  # 8080 y se publica en el 8082 del host. No pide credenciales (sección 45.3).
  # Arranca tras iceberg-init, para que los jobs encuentren los namespaces.
  # Corre como el usuario spark (185:185) de la imagen y no escribe en ningún
  # directorio del host; por eso no necesita volumes-init.
  spark-master:
    image: elastiflix-spark:4.1.4-iceberg1.12.0
    build: *spark-build
    # --host: el master se anuncia con el nombre del servicio, que es el que
    # usan el worker y los drivers para encontrarlo.
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      <<: *spark-environment
      # Memoria del proceso del master. Por defecto pediría 1 GB, el doble de
      # lo que permite el límite del contenedor.
      SPARK_DAEMON_MEMORY: 256m
    ports: *ports-spark-master
    volumes: *spark-volumes
    depends_on:
      iceberg-init:
        condition: service_completed_successfully
    # Está sano cuando su API responde que el master está activo.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/json/ | grep -q '\"status\" : \"ALIVE\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # spark-worker (diseño, secciones 19, 39 y 40)
  # ---------------------------------------------------------------------------
  # Ejecuta los jobs: aloja el ejecutor de cada aplicación, que es quien lee y
  # escribe los archivos Iceberg en RustFS. Ofrece al clúster 1.5 GB, lo justo
  # para un ejecutor (spark.executor.memory en pyspark/conf), así que corre una
  # aplicación a la vez y la siguiente espera.
  #
  # Mientras no exista Airflow, un job se lanza a mano en un contenedor temporal
  # de este servicio, que hace de driver en modo cliente:
  #
  #   docker compose run --rm --no-deps spark-worker spark-submit /opt/spark/jobs/bronze_to_silver.py
  #
  # No se lanza con `docker compose exec` dentro del master ni del worker: el
  # driver, de 1 GB, no cabe en el límite de memoria de ninguno de los dos.
  spark-worker:
    image: elastiflix-spark:4.1.4-iceberg1.12.0
    build: *spark-build
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      <<: *spark-environment
      # Memoria del proceso del worker, aparte de la del ejecutor.
      SPARK_DAEMON_MEMORY: 256m
      # Lo que el worker ofrece a las aplicaciones. Sin fijarlo ofrecería toda
      # la memoria y todos los núcleos del host, no los del contenedor.
      SPARK_WORKER_MEMORY: 1500m
      SPARK_WORKER_CORES: 4
    volumes: *spark-volumes
    depends_on:
      spark-master:
        condition: service_healthy
    # Está sano cuando el master lo ve registrado.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://spark-master:8080/json/ | grep -q '\"aliveworkers\" : [1-9]'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 3g

  # ---------------------------------------------------------------------------
  # airflow-init (job one-shot; diseño, secciones 18, 39 y 45.4)
  # ---------------------------------------------------------------------------
  # Prepara la base de metadatos de Airflow: crea o actualiza sus tablas, las
  # del gestor de autenticación incluidas, y crea el administrador de la
  # interfaz web con el usuario y la contraseña de .env; la contraseña queda
  # cifrada en metadata-db. Es idempotente: sobre una base ya migrada no
  # cambia nada, y como `airflow users create` falla si el usuario existe,
  # antes comprueba si ya está. Los tres servicios de Airflow esperan a que
  # termine. Corre como el usuario airflow (50000:0) de la imagen;
  # volumes-init le deja preparado airflow/logs.
  airflow-init:
    image: elastiflix-airflow:3.4.0-spark4.1.4
    build: *airflow-build
    command:
      - bash
      - -c
      - |
        set -eu
        airflow db migrate
        if airflow users list --output json | grep -q "\"username\": \"$$AIRFLOW_ADMIN_USER\""; then
          echo "El administrador $$AIRFLOW_ADMIN_USER ya existe."
        else
          airflow users create --role Admin \
            --username "$$AIRFLOW_ADMIN_USER" --password "$$AIRFLOW_ADMIN_PASSWORD" \
            --firstname ElastiFlix --lastname Admin --email "$$AIRFLOW_ADMIN_USER@example.com"
        fi
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?falta AIRFLOW_ADMIN_USER en .env}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?falta AIRFLOW_ADMIN_PASSWORD en .env}
    volumes: *airflow-volumes
    depends_on:
      metadata-db:
        condition: service_healthy
      volumes-init:
        condition: service_completed_successfully
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # airflow-apiserver (diseño, secciones 18, 39 y 45.4)
  # ---------------------------------------------------------------------------
  # Interfaz web y API de Airflow, en http://127.0.0.1:8080. Sirve también la
  # API de ejecución, por la que cada tarea reporta su estado. Pide usuario y
  # contraseña: el administrador lo crea airflow-init.
  airflow-apiserver:
    image: elastiflix-airflow:3.4.0-spark4.1.4
    build: *airflow-build
    command: ["api-server"]
    environment:
      <<: *airflow-environment
    ports: *ports-airflow-apiserver
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Está sano cuando responde su comprobación de salud, que no pide
    # credenciales.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # airflow-scheduler (diseño, secciones 18, 39 y 40)
  # ---------------------------------------------------------------------------
  # Decide cuándo corre cada tarea del DAG y, con LocalExecutor, las ejecuta
  # él mismo. Cada tarea de Spark lanza spark-submit en modo cliente, así que
  # el driver de cada job corre dentro de este contenedor: por eso es el
  # servicio de Airflow con más memoria. Los ejecutores, en spark-worker, se
  # conectan de vuelta a él por el nombre del servicio.
  # No espera a Spark: solo las corridas del DAG lo necesitan.
  airflow-scheduler:
    image: elastiflix-airflow:3.4.0-spark4.1.4
    build: *airflow-build
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Está sano mientras su latido en la base de metadatos sea reciente.
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 2g

  # ---------------------------------------------------------------------------
  # airflow-dag-processor (diseño, secciones 18, 39 y 40)
  # ---------------------------------------------------------------------------
  # Lee los archivos de airflow/dags y registra sus DAG en la base de
  # metadatos. En Airflow 3 es un servicio aparte del scheduler: sin él, ni
  # el scheduler ni la interfaz ven ningún DAG.
  airflow-dag-processor:
    image: elastiflix-airflow:3.4.0-spark4.1.4
    build: *airflow-build
    command: ["dag-processor"]
    environment:
      <<: *airflow-environment
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # Está sano mientras su latido en la base de metadatos sea reciente.
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # duckdb (herramienta opcional, perfil tools; diseño, secciones 34 y 39)
  # ---------------------------------------------------------------------------
  # Línea de comandos de DuckDB para explorar el lakehouse a mano. No forma
  # parte del flujo: `docker compose up` no lo arranca. Se lanza cuando se
  # quiere, con el laboratorio en marcha:
  #
  #   docker compose --profile tools run --rm duckdb
  #
  # Abre la consola con el catálogo adjunto como lake (lake.bronze, lake.silver
  # y lake.gold). Para crear además las vistas de Gold, dentro de la consola:
  #
  #   .read /duckdb/init/gold_views.sql
  #
  # Una consulta suelta, sin abrir la consola:
  #
  #   docker compose --profile tools run --rm duckdb -c "SELECT count(*) FROM lake.gold.genre_performance"
  #
  # Corre como el usuario duckdb (10003:10003) de su imagen. No publica puertos
  # ni escribe en ningún directorio del host.
  duckdb:
    image: elastiflix-duckdb:1.5.6
    build:
      context: ./duckdb
    profiles: ["tools"]
    environment:
      # La clave de RustFS. El script de arranque la pone en los marcadores de
      # duckdb/init/attach_lakehouse.sql justo antes de ejecutarlo.
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?falta RUSTFS_ACCESS_KEY en .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?falta RUSTFS_SECRET_KEY en .env}
    volumes:
      - ./duckdb/init:/duckdb/init:ro
    stdin_open: true
    tty: true
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # superset-init (job one-shot; diseño, secciones 35, 39 y 45.4)
  # ---------------------------------------------------------------------------
  # Prepara la base de metadatos de Superset: crea o actualiza sus tablas, crea
  # el administrador de la interfaz web con el usuario y la contraseña de .env
  # y carga los roles y permisos. No registra ninguna base de datos ni ningún
  # dashboard: eso lo hace quien usa el laboratorio (sección 35).
  # Es idempotente: sobre una base ya migrada no cambia nada, y antes de crear
  # el administrador comprueba si ya existe. El servicio superset espera a que
  # termine. Corre como el usuario superset (1000:1000) de la imagen;
  # volumes-init le deja preparado superset/data.
  superset-init:
    image: elastiflix-superset:6.1.0-duckdb1.5.6
    build: *superset-build
    command:
      - bash
      - -c
      - |
        set -eu
        superset db upgrade
        if superset fab list-users | grep -q "username:$$SUPERSET_ADMIN_USER "; then
          echo "El administrador $$SUPERSET_ADMIN_USER ya existe."
        else
          superset fab create-admin             --username "$$SUPERSET_ADMIN_USER" --password "$$SUPERSET_ADMIN_PASSWORD"             --firstname ElastiFlix --lastname Admin --email "$$SUPERSET_ADMIN_USER@example.com"
        fi
        superset init
    environment:
      <<: *superset-environment
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?falta SUPERSET_ADMIN_USER en .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?falta SUPERSET_ADMIN_PASSWORD en .env}
    volumes: *superset-volumes
    depends_on:
      metadata-db:
        condition: service_healthy
      volumes-init:
        condition: service_completed_successfully
    mem_limit: 1g

  # ---------------------------------------------------------------------------
  # superset (diseño, secciones 35, 39 y 45.4)
  # ---------------------------------------------------------------------------
  # Visualización: http://127.0.0.1:8088. Pide usuario y contraseña; el
  # administrador lo crea superset-init. Se entrega vacío: la base de datos,
  # los datasets y los gráficos los crea quien usa el laboratorio (guía en la
  # sección 35 del diseño).
  # Consulta Gold con el DuckDB que lleva dentro. Cada conexión nueva adjunta
  # el lakehouse y crea las vistas de Gold: lo hace el hook de
  # superset/config/superset_config.py con el SQL de duckdb/init/.
  # No espera a Spark ni a que Gold tenga datos: solo los datasets los
  # necesitan. El healthcheck es el que ya declara la imagen (curl a /health).
  superset:
    image: elastiflix-superset:6.1.0-duckdb1.5.6
    build: *superset-build
    environment:
      <<: *superset-environment
      # Cuatro procesos atienden las peticiones. Cada uno tiene su propio
      # DuckDB en memoria.
      SERVER_WORKER_AMOUNT: 4
    ports: *ports-superset
    volumes: *superset-volumes
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 2g
