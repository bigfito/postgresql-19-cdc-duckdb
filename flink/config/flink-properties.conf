# =============================================================================
# ElastiFlix: configuración de Flink (diseño, sección 14)
# =============================================================================
# Una opción por línea, con el formato «clave: valor». El Dockerfile las aplica
# sobre la configuración por defecto de la imagen al construirla; cambiar algo
# aquí exige reconstruir (docker compose up --build).
#
# Los valores no pueden llevar espacios ni el carácter '#'.

# --- Dónde está el JobManager -------------------------------------------------
# Dirección con la que el TaskManager y el cliente de envío llegan al
# JobManager. El servidor escucha en todas las interfaces del contenedor.
rest.address: flink-jobmanager
rest.bind-address: 0.0.0.0

# --- Memoria ------------------------------------------------------------------
# Por debajo de los límites del Compose (sección 39): 1 GB para el JobManager y
# 2 GB para el TaskManager.
jobmanager.memory.process.size: 900m
taskmanager.memory.process.size: 1800m
taskmanager.numberOfTaskSlots: 2

# --- Checkpoints --------------------------------------------------------------
# El sink de Iceberg publica los datos en cada checkpoint: sin checkpoints,
# Bronze queda vacío. Cada 30 segundos.
execution.checkpointing.interval: 30s

# Se guardan en flink/data/, montado en la misma ruta en el JobManager y en el
# TaskManager.
execution.checkpointing.dir: file:///opt/flink/state/checkpoints

# Se conservan aunque el job se cancele o el JobManager se reinicie. Es lo que
# permite a flink-cdc-submit reanudar el pipeline sin repetir el snapshot.
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
