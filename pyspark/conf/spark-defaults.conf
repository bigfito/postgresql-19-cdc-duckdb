# =============================================================================
# ElastiFlix: configuración de Spark (diseño, secciones 18, 19 y 39)
# =============================================================================
# La leen los servicios spark-master y spark-worker y todo spark-submit que se
# lance con este directorio como configuración: en los contenedores de Spark
# está montado en /opt/spark/conf, y en los de Airflow se señala con
# SPARK_CONF_DIR.
#
# Aquí no hay credenciales. La clave de RustFS llega a cada contenedor en las
# variables de entorno AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_REGION, y
# S3FileIO la toma de ahí.

# -----------------------------------------------------------------------------
# Catálogo Iceberg «lake» (comprobado en las validaciones 5 y 6)
# -----------------------------------------------------------------------------
# El mismo catálogo REST que usan Flink y DuckDB. Las tablas se nombran
# lake.bronze.<tabla>, lake.silver.<tabla> y lake.gold.<tabla>.
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                 rest
spark.sql.catalog.lake.uri                  http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse            s3://warehouse/
spark.sql.catalog.lake.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint          http://rustfs:9000
spark.sql.catalog.lake.s3.path-style-access true

# Todos los timestamps se leen y se escriben en UTC, sea cual sea la zona del
# contenedor que hace de driver.
spark.sql.session.timeZone                  UTC

# -----------------------------------------------------------------------------
# Clúster y memoria (diseño, sección 39)
# -----------------------------------------------------------------------------
# Clúster standalone del laboratorio. Solo admite modo cliente para Python: el
# driver corre en el contenedor que lanza spark-submit.
spark.master                                spark://spark-master:7077
# Un ejecutor de 1.5 GB, que es lo que ofrece spark-worker, y un driver de 1 GB.
spark.executor.memory                       1500m
spark.driver.memory                         1g

# -----------------------------------------------------------------------------
# Tamaño del laboratorio
# -----------------------------------------------------------------------------
# Las tablas tienen como mucho unos cientos de miles de filas. Con las 200
# particiones por defecto, cada shuffle repartiría esas filas en tareas casi
# vacías y cada escritura dejaría muchos archivos pequeños.
spark.sql.shuffle.partitions                4
