# =============================================================================
# ElastiFlix: registro de Spark
# =============================================================================
# Es el perfil por defecto de Spark (todo a la salida de error, nivel INFO),
# con un solo cambio, al final. Lo leen el master, el worker, los ejecutores y
# el driver de cada job. Cada job baja después el nivel de su driver a WARN
# para que sus propios mensajes se lean.

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Servidor web interno de Spark: demasiado detalle.
logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error

# Las claves sustitutas de Silver se numeran con max(SK) + row_number() sobre
# todas las filas nuevas (diseño, sección 21). Esa numeración es global, así
# que Spark avisa, cada vez que la planifica, de que lleva las filas a una sola
# partición. Con el volumen del laboratorio es lo esperado: el aviso se repite
# más de cien veces por corrida y tapa los que sí importan.
logger.window.name = org.apache.spark.sql.execution.window.WindowExec
logger.window.level = error
